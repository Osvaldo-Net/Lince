{# _modal_config.html — Configuración del sistema #}
<style>
  .cfg-input {
    width:100%; height:40px; padding:0 12px; border-radius:10px; font-size:14px;
    background:#fff; border:1px solid #e5e7eb; color:#0a0e14; outline:none;
    transition:border-color .15s, box-shadow .15s; font-family:"Inter",sans-serif;
  }
  .cfg-input::placeholder { color:#94a3b8; }
  .cfg-input:focus { border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .dark .cfg-input { background:#0b0d12; border-color:#232838; color:#f1f5f9; }

  .cfg-chip {
    height:30px; padding:0 12px; border-radius:8px; font-size:13px; font-weight:500;
    background:transparent; border:1px solid #e5e7eb; color:#475569;
    transition:background-color .15s, border-color .15s, color .15s;
  }
  .cfg-chip:hover { background:#EFF6FF; border-color:#BFDBFE; color:#2563EB; }
  .dark .cfg-chip { border-color:#262b38; color:#94a3b8; }
  .dark .cfg-chip:hover { background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.3); color:#60A5FA; }

  .cfg-label { display:block; font-size:13px; color:#64748b; margin-bottom:6px; }
  .dark .cfg-label { color:#94a3b8; }
  .cfg-title { font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .cfg-hint  { font-size:12px; color:#94a3b8; }
</style>

<div id="modal-config" class="fixed inset-0 modal-overlay flex items-end sm:items-center justify-center z-[65] hidden">
  <div class="card w-full sm:max-w-md relative fade-in max-h-[90vh] overflow-y-auto custom-scrollbar rounded-b-none sm:rounded-[14px]">

    <!-- Encabezado -->
    <div class="flex items-center justify-between px-6 pt-5 pb-4">
      <div class="flex items-center gap-2.5">
        <i data-lucide="settings" class="w-[18px] h-[18px]" style="color:#2563EB"></i>
        <span class="font-display font-bold text-solid" style="font-size:18px;letter-spacing:-.02em" data-i18n="cfgTitle">Configuración del sistema</span>
      </div>
      <button onclick="cerrarConfig()" aria-label="Cerrar"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-dark3 transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="divide-y divide-slate-100 dark:divide-slate-800/50 border-t border-slate-100 dark:border-slate-800/50">

      <!-- Telegram -->
      <div class="px-6 py-5">
        <div class="flex items-center gap-2.5 mb-4 text-solid">
          <i data-lucide="send" class="w-4 h-4 text-slate-400"></i>
          <span class="cfg-title" data-i18n="cfgTelegram">Notificaciones Telegram</span>
        </div>
        <div class="space-y-3.5">
          <div>
            <label class="cfg-label" data-i18n="cfgToken">Bot Token</label>
            <input id="cfg-token" type="password" placeholder="123456:ABC-DEF..." class="cfg-input" autocomplete="off" />
          </div>
          <div>
            <label class="cfg-label" data-i18n="cfgChatId">Chat ID</label>
            <input id="cfg-chat" type="text" placeholder="-100123456789" class="cfg-input" autocomplete="off" />
          </div>
          <button onclick="testTelegram()" class="cfg-chip inline-flex items-center gap-1.5" style="height:34px">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            <span data-i18n="cfgTestBtn">Probar conexión</span>
          </button>
        </div>
      </div>

      <!-- Monitoreo -->
      <div class="px-6 py-5">
        <div class="flex items-center gap-2.5 mb-4 text-solid">
          <i data-lucide="timer" class="w-4 h-4 text-slate-400"></i>
          <span class="cfg-title" data-i18n="cfgMonitoring">Monitoreo de red</span>
        </div>
        <label class="cfg-label">
          <span data-i18n="cfgInterval">Intervalo de escaneo</span>
          <span class="cfg-hint ml-1" data-i18n="cfgIntervalMin">(mín. 30s)</span>
        </label>
        <div class="flex items-center gap-2.5 mb-3">
          <input id="cfg-intervalo" type="number" min="30" max="3600" value="120"
            class="cfg-input tabular-nums" style="width:88px" inputmode="numeric" />
          <span class="cfg-hint" style="font-size:13px" data-i18n="cfgIntervalUnit">seg</span>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="setIntervalo(30)"  class="cfg-chip">30s</button>
          <button onclick="setIntervalo(60)"  class="cfg-chip">1 min</button>
          <button onclick="setIntervalo(120)" class="cfg-chip">2 min</button>
          <button onclick="setIntervalo(300)" class="cfg-chip">5 min</button>
          <button onclick="setIntervalo(600)" class="cfg-chip">10 min</button>
        </div>
      </div>

      <!-- Sesión -->
      <div class="px-6 py-5">
        <div class="flex items-center gap-2.5 mb-4 text-solid">
          <i data-lucide="shield" class="w-4 h-4 text-slate-400"></i>
          <span class="cfg-title" data-i18n="cfgSession">Tiempo de sesión</span>
        </div>
        <div class="flex items-center gap-2.5 mb-3">
          <input id="cfg-session" type="number" min="0.083" max="24" step="0.5" value="8"
            class="cfg-input tabular-nums" style="width:88px" inputmode="decimal" />
          <span class="cfg-hint" style="font-size:13px" data-i18n="cfgSessionUnit">horas</span>
        </div>
        <div class="flex gap-2 flex-wrap mb-3.5">
          <button onclick="document.getElementById('cfg-session').value=0.5" class="cfg-chip">30 min</button>
          <button onclick="document.getElementById('cfg-session').value=1"   class="cfg-chip">1h</button>
          <button onclick="document.getElementById('cfg-session').value=4"   class="cfg-chip">4h</button>
          <button onclick="document.getElementById('cfg-session').value=8"   class="cfg-chip">8h</button>
        </div>
        <p class="cfg-hint" data-i18n="cfgSessionDesc">
          La sesión se cierra automáticamente tras el tiempo configurado de inactividad.
        </p>
      </div>
    </div>

    <!-- Pie -->
    <div class="flex justify-end gap-2.5 px-6 py-4 border-t border-slate-100 dark:border-slate-800/50">
      <button onclick="cerrarConfig()"
        class="px-4 py-2 font-medium border border-slate-200 dark:border-slate-700 rounded-[10px] hover:bg-slate-50 dark:hover:bg-dark3 transition text-slate-600 dark:text-slate-400"
        style="font-size:14px" data-i18n="cfgCancel">Cancelar</button>
      <button onclick="guardarConfig()"
        class="px-4 py-2 font-semibold text-white rounded-[10px] bg-brand-500 hover:bg-brand-600 transition-colors"
        style="font-size:14px" data-i18n="cfgSave">Guardar cambios</button>
    </div>

  </div>
</div>
