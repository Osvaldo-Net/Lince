{# _panel_confiables.html — Panel lateral: MACs de confianza #}
<style>
  .cf-input {
    width:100%; height:38px; padding:0 12px; border-radius:10px; font-size:13.5px;
    background:#fff; border:1px solid #e5e7eb; color:#0a0e14; outline:none;
    transition:border-color .15s, box-shadow .15s; font-family:"Inter",sans-serif;
  }
  .cf-input::placeholder { color:#94a3b8; }
  .cf-input:focus { border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .dark .cf-input { background:#0b0d12; border-color:#232838; color:#f1f5f9; }
  .cf-btn {
    height:38px; padding:0 14px; border-radius:10px; font-size:13.5px; font-weight:600;
    color:#fff; background:#2563EB; transition:background-color .15s; flex-shrink:0;
  }
  .cf-btn:hover { background:#1D4ED8; }
</style>

<div id="panel-confiables" class="right-panel narrow" aria-label="Confiables">
  <div class="panel-header">
    <div>
      <h2 class="font-display font-bold text-solid" style="font-size:18px;letter-spacing:-.02em" data-i18n="trustedDevices">Dispositivos Confiables</h2>
      <p class="text-slate-400 dark:text-slate-500 mt-1" style="font-size:13px" data-i18n="trustedSubtitle">MACs marcadas como de confianza</p>
    </div>
    <button onclick="cerrarPanelConfiables()" aria-label="Cerrar"
      class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-dark3 transition">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Agregar MAC -->
  <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800/60">
    <p class="text-slate-600 dark:text-slate-300 mb-2 font-semibold" style="font-size:14px" data-i18n="addTrusted">Agregar MAC confiable</p>
    <form id="form-agregar" class="flex gap-2">
      <input type="text" id="input-mac" placeholder="00:1A:2B:3C:4D:5E" required
        class="cf-input tabular-nums flex-1" autocomplete="off" autocapitalize="off" />
      <button type="submit" class="cf-btn" data-i18n="add">Agregar</button>
    </form>
  </div>

  <!-- Lista -->
  <ul id="lista-macs" class="flex-1 overflow-y-auto custom-scrollbar px-5 py-4 space-y-2">
    {% for item in lista_confiables %}
    <li data-mac="{{ item.mac|lower }}"
      class="flex items-center gap-3 px-3.5 py-3 rounded-[10px] border border-slate-200/80 dark:border-slate-800/60 hover:bg-slate-50 dark:hover:bg-dark3/40 transition group">
      <span class="w-2 h-2 rounded-full bg-brand-400 flex-shrink-0"></span>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <p class="nombre-confiable font-medium text-solid truncate" style="font-size:14px">
            {{ item.nombre if item.nombre else 'Sin nombre' }}
          </p>
          <button onclick="editarNombreConfiable('{{ item.mac }}')" aria-label="Editar nombre"
            class="opacity-0 group-hover:opacity-100 focus:opacity-100 text-slate-300 hover:text-slate-600 dark:hover:text-slate-300 transition flex-shrink-0">
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <p class="tabular-nums text-slate-400 mt-0.5" style="font-size:12px">{{ item.mac }}</p>
      </div>
      <button onclick="eliminarMAC('{{ item.mac }}')" aria-label="Eliminar" class="text-slate-300 hover:text-rose-500 transition p-1 flex-shrink-0">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </li>
    {% endfor %}
  </ul>
</div>
