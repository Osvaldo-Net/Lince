{# _stats.html — Tarjetas de resumen: número grande, etiqueta debajo #}
<style>
  .stat-box { padding:18px 20px 16px; }
  .stat-num {
    font-size:34px; line-height:1; font-weight:500; letter-spacing:-.03em;
    color:#1e293b; font-variant-numeric:tabular-nums;
  }
  .dark .stat-num { color:#f1f5f9; }
  .stat-line { display:block; height:2px; border-radius:2px; margin-top:22px; opacity:.55; }
  .stat-title { font-size:14px; font-weight:500; margin-top:10px; }
  .stat-desc  { font-size:12px; color:#94a3b8; margin-top:2px; }
</style>

<div class="stats-grid stagger-1 fade-in">
  <!-- Total -->
  <div>
    <div class="card stat-box">
      <p id="stat-total" class="stat-num">0</p>
      <span class="stat-line" style="background:#94a3b8"></span>
    </div>
    <p class="stat-title text-slate-700 dark:text-slate-300" data-i18n="statTotal">Total</p>
    <p class="stat-desc" data-i18n="statTotalDesc">Dispositivos en red</p>
  </div>

  <!-- Confiables -->
  <div>
    <div class="card stat-box">
      <p id="stat-trusted" class="stat-num">0</p>
      <span class="stat-line" style="background:#3B82F6"></span>
    </div>
    <p class="stat-title" style="color:#2563EB" data-i18n="statTrusted">Confiables</p>
    <p class="stat-desc" data-i18n="statTrustedDesc">Verificados por ti</p>
  </div>

  <!-- Sin verificar -->
  <div>
    <div class="card stat-box">
      <p id="stat-untrusted" class="stat-num">0</p>
      <span class="stat-line" style="background:#cbd5e1"></span>
    </div>
    <p class="stat-title text-slate-500 dark:text-slate-400" data-i18n="statUntrusted">Sin verificar</p>
    <p class="stat-desc" data-i18n="statUntrustedDesc">Requieren revisión</p>
  </div>
</div>
