{# 🌊 _stats.html 🌊 Stat summary cards (total / trusted / untrusted) #}
<div class="stats-grid stagger-1 fade-in">
  <!-- Total -->
  <div class="card px-5 py-4 transition-shadow hover:shadow-md">
    <div class="flex items-center justify-between mb-4">
      <span class="text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-widest" style="font-size:11px" data-i18n="statTotal">Total</span>
      <div class="flex items-center justify-center" style="width:30px;height:30px;border-radius:10px;background:rgba(37,99,235,.08)">
        <i data-lucide="laptop" class="w-3.5 h-3.5" style="color:#2563EB"></i>
      </div>
    </div>
    <p id="stat-total" class="tabular-nums font-bold leading-none mb-1.5" style="font-size:34px;letter-spacing:-.02em;color:#0a0e14">0</p>
    <p class="text-slate-500 dark:text-slate-400" style="font-size:12px" data-i18n="statTotalDesc">Dispositivos en red</p>
  </div>
  <!-- Trusted -->
  <div class="card px-5 py-4 transition-shadow hover:shadow-md">
    <div class="flex items-center justify-between mb-4">
      <span class="font-semibold uppercase tracking-widest" style="font-size:11px;color:#0f9d63" data-i18n="statTrusted">Confiables</span>
      <div class="flex items-center justify-center" style="width:30px;height:30px;border-radius:10px;background:rgba(15,157,99,.08)">
        <i data-lucide="shield-check" class="w-3.5 h-3.5" style="color:#0f9d63"></i>
      </div>
    </div>
    <p id="stat-trusted" class="tabular-nums font-bold leading-none mb-1.5" style="font-size:34px;letter-spacing:-.02em;color:#0f9d63">0</p>
    <p class="text-slate-500 dark:text-slate-400" style="font-size:12px" data-i18n="statTrustedDesc">Verificados por ti</p>
  </div>
  <!-- Untrusted -->
  <div class="card px-5 py-4 transition-shadow hover:shadow-md">
    <div class="flex items-center justify-between mb-4">
      <span class="font-semibold uppercase tracking-widest" style="font-size:11px;color:#e0405a" data-i18n="statUntrusted">Sin verificar</span>
      <div class="flex items-center justify-center" style="width:30px;height:30px;border-radius:10px;background:rgba(224,64,90,.08)">
        <i data-lucide="shield-alert" class="w-3.5 h-3.5" style="color:#e0405a"></i>
      </div>
    </div>
    <p id="stat-untrusted" class="tabular-nums font-bold leading-none mb-1.5" style="font-size:34px;letter-spacing:-.02em;color:#e0405a">0</p>
    <p class="text-slate-500 dark:text-slate-400" style="font-size:12px" data-i18n="statUntrustedDesc">Requieren revisión</p>
  </div>
</div>
