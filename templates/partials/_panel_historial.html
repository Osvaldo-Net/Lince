{# _panel_historial.html — Panel lateral: historial de red #}
<style>
  .pn-input {
    width:100%; height:38px; padding:0 12px; border-radius:10px; font-size:13.5px;
    background:#fff; border:1px solid #e5e7eb; color:#0a0e14; outline:none;
    transition:border-color .15s, box-shadow .15s; font-family:"Inter",sans-serif;
  }
  .pn-input::placeholder { color:#94a3b8; }
  .pn-input:focus { border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .dark .pn-input { background:#0b0d12; border-color:#232838; color:#f1f5f9; }

  .pn-btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 14px;
    border-radius:10px; font-size:13.5px; font-weight:600; color:#fff; background:#2563EB;
    transition:background-color .15s; flex-shrink:0;
  }
  .pn-btn:hover { background:#1D4ED8; }

  /* Tarjetas generadas por cargarHistorial() en panel.js */
  .hist-card { padding:12px 14px; border:1px solid #e5e7eb; border-radius:10px; }
  .dark .hist-card { border-color:#232838; }
</style>

<div id="panel-historial" class="right-panel" aria-label="Historial">

  <div class="panel-header">
    <div>
      <h2 class="font-display font-bold text-solid" style="font-size:18px;letter-spacing:-.02em" data-i18n="historyTitle">Historial de red</h2>
      <p class="text-slate-400 dark:text-slate-500 mt-1" style="font-size:13px" data-i18n="historySubtitle">Solo registra conexiones y desconexiones</p>
    </div>
    <button onclick="cerrarPanelHistorial()" aria-label="Cerrar"
      class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-dark3 transition">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Filtros -->
  <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800/60 space-y-3">
    <div class="flex gap-2">
      <input id="hist-mac" type="text" data-i18n="historyMac" placeholder="Filtrar por MAC" class="pn-input flex-1 tabular-nums" />
      <div class="relative flex-shrink-0" style="width:150px">
        <button id="histEventoBtn" onclick="document.getElementById('histEventoMenu').classList.toggle('hidden')"
          class="pn-input flex items-center justify-between gap-1.5 cursor-pointer text-left">
          <div class="flex items-center gap-2">
            <span id="hist-evento-dot" class="inline-block w-2 h-2 rounded-full bg-slate-400 flex-shrink-0"></span>
            <span id="histEventoLabel" data-i18n="historyAll" class="truncate">Todos</span>
          </div>
          <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"></i>
        </button>
        <div id="histEventoMenu" class="dropdown-menu hidden" style="width:150px">
          <button onclick="setHistEvento('','historyAll','bg-slate-400')" class="dropdown-item"><span class="w-2 h-2 rounded-full bg-slate-400 flex-shrink-0"></span><span data-i18n="historyAll">Todos</span></button>
          <button onclick="setHistEvento('conectado','historyConn','bg-brand-400')" class="dropdown-item"><span class="w-2 h-2 rounded-full bg-brand-400 flex-shrink-0"></span><span data-i18n="historyConn">Conectado</span></button>
          <button onclick="setHistEvento('desconectado','historyDisc','bg-slate-300')" class="dropdown-item"><span class="w-2 h-2 rounded-full bg-slate-300 flex-shrink-0"></span><span data-i18n="historyDisc">Desconectado</span></button>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="cargarHistorial()" class="pn-btn">
        <i data-lucide="search" class="w-4 h-4"></i>
        <span data-i18n="historySearch">Buscar</span>
      </button>
      <label class="flex items-center gap-2 cursor-pointer select-none ml-auto">
        <div class="toggle-track on" id="toggleTrack"
          onclick="this.classList.toggle('on'); document.getElementById('hist-auto').checked=this.classList.contains('on'); toggleAutoRefresh(this.classList.contains('on'))">
          <div class="toggle-thumb"></div>
        </div>
        <span class="text-slate-500 dark:text-slate-400" style="font-size:13px" data-i18n="historyAutoRefresh">Auto-actualizar</span>
        <input type="checkbox" id="hist-auto" class="sr-only" checked onchange="toggleAutoRefresh(this.checked)" />
      </label>
    </div>
  </div>

  <!-- Tarjetas -->
  <div id="historial-cards" class="flex-1 overflow-y-auto custom-scrollbar px-5 py-4 space-y-2">
    <div class="text-center text-slate-400 py-12 flex flex-col items-center gap-3" style="font-size:13px">
      <i data-lucide="clock" class="w-6 h-6 opacity-30"></i>
      <span data-i18n="historyEmpty">Presiona Buscar para cargar el historial</span>
    </div>
  </div>

  <!-- Pie -->
  <div class="px-5 py-3.5 border-t border-slate-100 dark:border-slate-800/50 flex items-center justify-between flex-shrink-0">
    <p id="hist-info" class="text-slate-400" style="font-size:12px"></p>
    <button onclick="limpiarHistorial()" class="text-slate-400 hover:text-rose-600 flex items-center gap-1.5 transition" style="font-size:13px">
      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
      <span data-i18n="historyClear">Limpiar historial</span>
    </button>
  </div>
</div>
