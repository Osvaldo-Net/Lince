{# _topbar.html — Barra superior con filtros #}
<style>
  .tb-input {
    width:100%; height:40px; padding:0 12px 0 36px; border-radius:10px; font-size:14px;
    background:#fff; border:1px solid #e5e7eb; color:#0a0e14; outline:none;
    transition:border-color .15s, box-shadow .15s; font-family:"Inter",sans-serif;
  }
  .tb-input::placeholder { color:#94a3b8; }
  .tb-input:focus { border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .dark .tb-input { background:#11141b; border-color:#232838; color:#f1f5f9; }
  .dark .tb-input:focus { border-color:#3B82F6; }
  .tb-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#94a3b8; pointer-events:none; }
  .tb-select { display:flex; align-items:center; justify-content:space-between; cursor:pointer; text-align:left; padding-left:12px; }
</style>

<div class="sticky top-0 z-30 bg-white/90 dark:bg-dark1/90 backdrop-blur-sm px-4 sm:px-6 pt-4 pb-3 border-b border-slate-100 dark:border-slate-800/60">

  <!-- Móvil: título -->
  <div class="flex items-center justify-between mb-3 sm:hidden">
    <span class="pl-9 font-display font-bold text-slate-900 dark:text-white" style="font-size:16px;letter-spacing:-.02em">Lince</span>
    <button onclick="toggleDarkMode()" aria-label="Modo oscuro" class="p-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-dark3 transition">
      <i id="icono-luna-m" data-lucide="moon" class="w-4 h-4"></i>
      <i id="icono-sol-m"  data-lucide="sun"  class="w-4 h-4 hidden"></i>
    </button>
  </div>

  <!-- Filtros -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <div class="relative">
      <i data-lucide="search" class="tb-icon"></i>
      <input id="filtro-nombre" type="text" data-i18n="filterName" placeholder="Filtrar por nombre" class="tb-input" />
    </div>
    <div class="relative">
      <i data-lucide="hash" class="tb-icon"></i>
      <input id="filtro-mac" type="text" data-i18n="filterMac" placeholder="Filtrar por MAC" class="tb-input" />
    </div>
    <div class="relative">
      <button id="trustBtn" class="tb-input tb-select">
        <div class="flex items-center gap-2">
          <span id="trust-dot" class="inline-block w-2 h-2 rounded-full bg-slate-400 flex-shrink-0"></span>
          <span id="trustLabel" data-i18n="filterAll">Todos</span>
        </div>
        <i data-lucide="chevrons-up-down" class="w-4 h-4 text-slate-400 flex-shrink-0"></i>
      </button>
      <div id="trustMenu" class="dropdown-menu hidden">
        <button onclick="setTrustFilter('all')" class="dropdown-item"><span class="w-2 h-2 rounded-full bg-slate-400 flex-shrink-0"></span><span data-i18n="filterAll">Todos</span></button>
        <button onclick="setTrustFilter('trusted')" class="dropdown-item"><span class="w-2 h-2 rounded-full bg-brand-400 flex-shrink-0"></span><span data-i18n="filterTrusted">Confiables</span></button>
        <button onclick="setTrustFilter('untrusted')" class="dropdown-item"><span class="w-2 h-2 rounded-full bg-slate-300 flex-shrink-0"></span><span data-i18n="filterUntrusted">No confiables</span></button>
      </div>
    </div>
  </div>
</div>
