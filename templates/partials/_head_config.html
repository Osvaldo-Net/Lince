{# _head_config.html — Estilos globales (se incluye dentro de <head> en index.html).
   La config de Tailwind (colores brand azul, fuentes Inter) vive en index.html:
   NO se redefine aquí, porque pisaría esos valores. #}
<style>
  /* ── Animaciones ── */
  @keyframes fade-up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .fade-in   { animation:fade-up .4s cubic-bezier(.16,1,.3,1) forwards; }
  .stagger-1 { animation-delay:.05s;opacity:0; }
  .stagger-2 { animation-delay:.1s;opacity:0; }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation:none; opacity:1 !important; } }

  /* ── Scrollbars ── */
  .custom-scrollbar::-webkit-scrollbar       { width:4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background:rgba(100,116,139,.25);border-radius:4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background:transparent; }
  .no-scroll { -ms-overflow-style:none;scrollbar-width:none; }
  .no-scroll::-webkit-scrollbar { display:none; }

  #sess-bar { transition:width 1s linear; }

  /* ── Tarjeta plana ── */
  .card { background:#fff;border:1px solid #e5e7eb;border-radius:14px; }
  .dark .card { background:#11141b;border-color:#232838; }

  /* ── Estado: punto + texto (sin relleno) ── */
  .badge { display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;background:transparent;border:0;padding:0; }
  .badge::before { content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0; }
  .badge-green   { color:#2563EB; }
  .badge-red     { color:#94a3b8; }
  .badge-neutral { color:#64748b; }
  .dark .badge-green { color:#60A5FA; }
  .dark .badge-red   { color:#64748b; }

  /* ── Botones de acción (fantasma) ── */
  .btn-action {
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;
    font-size:13px;font-weight:500;cursor:pointer;background:transparent;
    border:1px solid #e5e7eb;color:#475569;transition:background-color .15s,border-color .15s,color .15s;
  }
  .btn-action:hover { background:#f5f6f8;border-color:#d5dae1; }
  .btn-action svg   { width:14px;height:14px; }
  .btn-trust        { color:#2563EB; }
  .btn-trust:hover  { background:#EFF6FF;border-color:#BFDBFE; }
  .dark .btn-action       { border-color:#262b38;color:#94a3b8; }
  .dark .btn-action:hover { background:#1a1e28;border-color:#333949; }
  .dark .btn-trust        { color:#60A5FA; }
  .dark .btn-trust:hover  { background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3); }

  /* ── Input genérico ── */
  .input-base {
    padding:0 12px;height:40px;border-radius:10px;font-size:14px;border:1px solid #e5e7eb;background:#fff;
    color:#0a0e14;outline:none;transition:border-color .15s,box-shadow .15s;width:100%;
  }
  .input-base:focus { border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .dark .input-base { background:#0b0d12;border-color:#232838;color:#f1f5f9; }

  /* ── Dropdown ── */
  .dropdown-menu {
    position:absolute;z-index:50;margin-top:6px;width:100%;background:#fff;border:1px solid #e5e7eb;
    border-radius:10px;box-shadow:0 8px 24px -8px rgba(15,23,42,.15);overflow:hidden;padding:4px;
  }
  .dark .dropdown-menu { background:#11141b;border-color:#232838; }
  .dropdown-item {
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13.5px;
    cursor:pointer;transition:background .1s;width:100%;border:none;background:transparent;text-align:left;color:#1e293b;
  }
  .dropdown-item:hover { background:#f5f6f8; }
  .dark .dropdown-item { color:#e2e8f0; }
  .dark .dropdown-item:hover { background:#1a1e28; }

  .divider { height:1px;background:#f1f5f9;margin:4px 0; }
  .dark .divider { background:#232838; }

  /* ── Modal overlay ── */
  .modal-overlay { background:rgba(15,23,42,.35);backdrop-filter:blur(4px); }

  /* ── Toggle ── */
  .toggle-track { width:34px;height:20px;border-radius:10px;background:#cbd5e1;position:relative;transition:background .2s;cursor:pointer;flex-shrink:0; }
  .toggle-track.on { background:#2563EB; }
  .toggle-thumb { position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s; }
  .toggle-track.on .toggle-thumb { transform:translateX(14px); }

  /* ── Paneles laterales ── */
  .right-panel {
    position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:#fff;
    border-left:1px solid #e5e7eb;z-index:60;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);
    box-shadow:-12px 0 32px -16px rgba(15,23,42,.12);
  }
  .right-panel.narrow { width:380px; }
  .right-panel.open   { transform:translateX(0); }
  .dark .right-panel  { background:#11141b;border-color:#232838;box-shadow:-12px 0 32px -16px rgba(0,0,0,.5); }

  .panel-overlay { position:fixed;inset:0;background:rgba(15,23,42,.18);backdrop-filter:blur(2px);z-index:59;opacity:0;pointer-events:none;transition:opacity .25s; }
  .panel-overlay.show { opacity:1;pointer-events:all; }

  .panel-header { display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid #f1f5f9;flex-shrink:0; }
  .dark .panel-header { border-color:#232838; }

  /* ── Grid de stats ── */
  .stats-grid { display:grid;gap:1rem;grid-template-columns:repeat(3,minmax(0,1fr)); }
  @media (max-width:479px) { .stats-grid { grid-template-columns:1fr; } }

  /* ── Navegación móvil ── */
  #mobile-nav { display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid #eef0f3;padding:6px 0 env(safe-area-inset-bottom,6px); }
  .dark #mobile-nav { background:#11141b;border-color:#232838; }
  @media (max-width:639px) {
    #mobile-nav { display:flex; }
    main        { padding-bottom:72px!important; }
  }

  @supports (padding-top:env(safe-area-inset-top)) {
    #sidebar { padding-top:env(safe-area-inset-top); }
  }
</style>
