<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Lince</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            dark1: "#0b0d12", dark2: "#11141b", dark3: "#1a1e28",
            brand: {
              50: "#ECFEFF", 100: "#CFFAFE", 400: "#22D3EE",
              500: "#06B6D4", 600: "#0891B2", 700: "#0E7490"
            }
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            display: ["Inter Tight", "Inter", "system-ui", "sans-serif"]
          }
        }
      }
    };
    if (localStorage.getItem("modoOscuro") === "true") {
      document.documentElement.classList.add("dark");
    }
  </script>

  <style>
    @keyframes enter { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .enter { animation: enter .4s cubic-bezier(.16,1,.3,1) both; }
    @media (prefers-reduced-motion: reduce) { .enter { animation:none; } }

    .brand-panel {
      background-color:#0b0d12;
      background-image:
        radial-gradient(circle at 20% 110%, rgba(6,182,212,.22), transparent 55%),
        radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 100% 100%, 22px 22px;
    }

    .text-solid { color:#0a0e14; }
    .dark .text-solid { color:#f8fafc; }

    .field {
      width:100%; padding:10px 12px 10px 38px; border-radius:8px; font-size:14px;
      border:1px solid #dde3ea; background:#fff; outline:none; box-sizing:border-box;
      transition:border-color .15s, box-shadow .15s; font-family:"Inter",sans-serif;
      color:#0a0e14; font-weight:500;
    }
    .field:focus { border-color:#0891B2; box-shadow:0 0 0 3px rgba(8,145,178,.14); }
    .field::placeholder { color:#94a3b8; font-weight:400; }
    .dark .field { background:#11141b; border-color:#262b38; color:#f1f5f9; }
    .dark .field:focus { border-color:#22D3EE; box-shadow:0 0 0 3px rgba(34,211,238,.18); }
    .field-icon {
      position:absolute; left:12px; top:50%; transform:translateY(-50%);
      width:16px; height:16px; color:#94a3b8; pointer-events:none;
    }

    .btn-main {
      width:100%; padding:11px 16px; border-radius:8px; font-size:14px; font-weight:600;
      background:#0891B2; color:#fff; border:none; cursor:pointer;
      font-family:"Inter",sans-serif; transition:background-color .15s;
    }
    .btn-main:hover { background:#0E7490; }
    .btn-main:focus-visible { outline:2px solid #22D3EE; outline-offset:2px; }

    /* Selector de idioma */
    .lang-btn { display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:8px;
      font-size:13px; font-weight:500; color:#475569; border:1px solid #e5e7eb; background:#fff; transition:background-color .15s; }
    .lang-btn:hover { background:#f5f6f8; }
    .dark .lang-btn { background:#11141b; border-color:#262b38; color:#cbd5e1; }
    .dark .lang-btn:hover { background:#1a1e28; }
    .lang-menu { position:absolute; right:0; margin-top:6px; min-width:150px; padding:4px; background:#fff;
      border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 8px 24px -8px rgba(15,23,42,.15); }
    .dark .lang-menu { background:#11141b; border-color:#262b38; }
    .lang-item { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:7px;
      font-size:13.5px; color:#1e293b; text-align:left; }
    .lang-item:hover { background:#f5f6f8; }
    .dark .lang-item { color:#e2e8f0; }
    .dark .lang-item:hover { background:#1a1e28; }

    .req-item { transition:color .2s; display:flex; align-items:center; gap:6px; font-size:12px; }
  </style>
</head>

<body class="bg-white dark:bg-dark2 font-sans antialiased text-[14px]">
  <main class="min-h-screen grid lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">

    <!-- Panel de marca (solo escritorio) -->
    <aside class="brand-panel hidden lg:flex flex-col items-center justify-center text-center p-12">
      <img src="{{ url_for('static', filename='lince-no-fondo.png') }}" alt="Lince" class="w-28 h-28">
      <p class="font-display font-bold text-white mt-6" style="font-size:44px;letter-spacing:-.035em;line-height:1">Lince</p>
    </aside>

    <!-- Formulario -->
    <section class="relative flex flex-col min-h-screen px-6">

      <!-- Selector de idioma -->
      <div class="absolute top-5 right-6 z-20">
        <button id="langBtn" type="button" class="lang-btn" aria-haspopup="true" aria-label="Idioma / Language">
          <span id="langFlag" class="fi fi-es rounded-sm flex-shrink-0" style="width:18px;height:13px"></span>
          <span id="langLabel">Español</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="langMenu" class="lang-menu hidden">
          <button type="button" onclick="setLang('es')" class="lang-item"><span class="fi fi-es rounded-sm" style="width:18px;height:13px"></span> Español</button>
          <button type="button" onclick="setLang('en')" class="lang-item"><span class="fi fi-us rounded-sm" style="width:18px;height:13px"></span> English</button>
          <button type="button" onclick="setLang('fr')" class="lang-item"><span class="fi fi-fr rounded-sm" style="width:18px;height:13px"></span> Français</button>
        </div>
      </div>

      <div class="flex-1 flex items-center justify-center py-12">
        <div class="w-full max-w-[360px] enter">

          <img src="{{ url_for('static', filename='lince-no-fondo.png') }}" alt="Lince" class="w-12 h-12 mb-6 lg:hidden">

          <h1 class="font-display font-bold text-solid" style="font-size:26px;letter-spacing:-.03em;line-height:1.1">Lince</h1>
          <p class="text-slate-500 dark:text-slate-400 mt-1.5 mb-8" data-i18n="credSubtitle">Actualiza tus credenciales de acceso</p>

          {% if error %}
          <div role="alert" class="mb-5 flex items-start gap-2 px-3 py-2.5 rounded-md text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10 border-l-2 border-rose-500" style="font-size:13px">
            <span class="font-medium">{{ error }}</span>
          </div>
          {% endif %}

          <form method="POST" action="{{ url_for('cambiar_credenciales') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Correo -->
            <div>
              <label for="nuevo_usuario" class="block text-solid mb-1.5 font-semibold" style="font-size:13px" data-i18n="credNewEmail">Nuevo correo</label>
              <div class="relative">
                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <input id="nuevo_usuario" type="email" name="nuevo_usuario" data-i18n="loginPlaceholderEmail" placeholder="correo@ejemplo.com" required autofocus autocomplete="email" class="field" />
              </div>
            </div>

            <!-- Nueva contraseña -->
            <div>
              <label for="nueva" class="block text-solid mb-1.5 font-semibold" style="font-size:13px" data-i18n="credNewPass">Nueva contraseña</label>
              <div class="relative">
                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input id="nueva" type="password" name="nueva_contrasena" placeholder="••••••••" required style="padding-right:38px" autocomplete="new-password" class="field" />
                <button type="button" onclick="toggleVer('nueva','eye-n','eye-off-n')" aria-label="Mostrar contraseña"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition p-1">
                  <svg id="eye-n" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg id="eye-off-n" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>

            <!-- Requisitos -->
            <div id="req-box" class="hidden rounded-lg border border-slate-200 dark:border-slate-800/60 px-3.5 py-3 grid grid-cols-2 gap-x-4 gap-y-2">
              <span data-req="length" class="req-item text-slate-400">
                <svg class="req-icon w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg>
                <span data-i18n="credReq8">8 caracteres</span>
              </span>
              <span data-req="upper" class="req-item text-slate-400">
                <svg class="req-icon w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg>
                <span data-i18n="credReqUpper">Mayúscula</span>
              </span>
              <span data-req="lower" class="req-item text-slate-400">
                <svg class="req-icon w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg>
                <span data-i18n="credReqLower">Minúscula</span>
              </span>
              <span data-req="digit" class="req-item text-slate-400">
                <svg class="req-icon w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg>
                <span data-i18n="credReqDigit">Número</span>
              </span>
              <span data-req="symbol" class="req-item text-slate-400 col-span-2">
                <svg class="req-icon w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg>
                <span data-i18n="credReqSymbol">Símbolo especial (!@#…)</span>
              </span>
            </div>

            <!-- Confirmar -->
            <div id="confirm-wrap" class="hidden">
              <label for="confirmar" class="block text-solid mb-1.5 font-semibold" style="font-size:13px" data-i18n="cfgConfirmPass">Confirmar contraseña</label>
              <div class="relative">
                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input id="confirmar" type="password" name="confirmar_contrasena" placeholder="••••••••" style="padding-right:38px" autocomplete="new-password" class="field" />
                <button type="button" onclick="toggleVer('confirmar','eye-c','eye-off-c')" aria-label="Mostrar contraseña"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition p-1">
                  <svg id="eye-c" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg id="eye-off-c" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
              <p id="match-msg" class="mt-1.5 hidden" style="font-size:12px"></p>
            </div>

            <button type="submit" class="btn-main !mt-6" data-i18n="cfgSave">Guardar cambios</button>
          </form>
        </div>
      </div>

      <!-- Pie -->
      <div class="flex items-center justify-between w-full max-w-[360px] mx-auto pb-6">
        <button onclick="toggleTheme()"
          class="flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition font-medium" style="font-size:12px">
          <svg id="th-moon" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="th-sun" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span id="th-label" data-i18n="changeTheme">Modo oscuro</span>
        </button>
        <a href="https://github.com/Osvaldo-Net/Lince" target="_blank" rel="noopener noreferrer"
          class="flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition font-medium" style="font-size:12px">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
          GitHub
        </a>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script>
    // Traducción con fallback: si i18n.js no cargó o falta la clave, usa el texto en español
    function tr(key, fallback) {
      try { const v = window.t ? t(key) : key; return (!v || v === key) ? fallback : v; }
      catch { return fallback; }
    }

    // Colores de estado apagados (cian de marca / rosa suave)
    const OK_COLOR   = '#0891B2';
    const FAIL_COLOR = '#be4b5d';

    function toggleVer(inputId, eyeId, eyeOffId) {
      const inp  = document.getElementById(inputId);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      document.getElementById(eyeId).classList.toggle('hidden', show);
      document.getElementById(eyeOffId).classList.toggle('hidden', !show);
    }

    const rules = {
      length: v => v.length >= 8,
      upper:  v => /[A-Z]/.test(v),
      lower:  v => /[a-z]/.test(v),
      digit:  v => /\d/.test(v),
      symbol: v => /[^A-Za-z0-9]/.test(v),
    };

    function makeIcon(type) {
      const ns  = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("class", "req-icon w-3.5 h-3.5 flex-shrink-0");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2.5");
      if (type === "ok") {
        svg.style.color = OK_COLOR;
        const p = document.createElementNS(ns, "polyline");
        p.setAttribute("points", "20 6 9 17 4 12");
        svg.appendChild(p);
      } else if (type === "fail") {
        svg.style.color = FAIL_COLOR;
        const l1 = document.createElementNS(ns, "line");
        l1.setAttribute("x1","18"); l1.setAttribute("y1","6");
        l1.setAttribute("x2","6");  l1.setAttribute("y2","18");
        const l2 = document.createElementNS(ns, "line");
        l2.setAttribute("x1","6");  l2.setAttribute("y1","6");
        l2.setAttribute("x2","18"); l2.setAttribute("y2","18");
        svg.appendChild(l1); svg.appendChild(l2);
      } else {
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx","12"); c.setAttribute("cy","12"); c.setAttribute("r","9");
        svg.appendChild(c);
      }
      return svg;
    }

    function setReqIcon(el, type) {
      const old = el.querySelector(".req-icon");
      const ico = makeIcon(type);
      if (old) el.replaceChild(ico, old); else el.insertBefore(ico, el.firstChild);
    }

    const passInput   = document.getElementById('nueva');
    const confInput   = document.getElementById('confirmar');
    const reqBox      = document.getElementById('req-box');
    const confirmWrap = document.getElementById('confirm-wrap');
    const matchMsg    = document.getElementById('match-msg');

    passInput.addEventListener('input', () => {
      const v = passInput.value;
      if (v.length > 0) {
        reqBox.classList.remove('hidden');
        confirmWrap.classList.remove('hidden');
      } else {
        reqBox.classList.add('hidden');
        confirmWrap.classList.add('hidden');
        confInput.value = '';
        matchMsg.classList.add('hidden');
      }
      Object.entries(rules).forEach(([id, fn]) => {
        const el = document.querySelector(`[data-req="${id}"]`);
        if (!el) return;
        if (v.length === 0) { setReqIcon(el, "idle"); el.style.color = ''; }
        else if (fn(v))     { setReqIcon(el, "ok");   el.style.color = OK_COLOR; }
        else                { setReqIcon(el, "fail"); el.style.color = FAIL_COLOR; }
      });
      if (confInput.value.length > 0) checkMatch();
    });

    confInput.addEventListener('input', checkMatch);

    function checkMatch() {
      const ok = confInput.value === passInput.value && confInput.value.length > 0;
      confInput.style.borderColor = ok ? OK_COLOR : (confInput.value.length > 0 ? '#e3a3ad' : '');
      if (confInput.value.length === 0) { matchMsg.classList.add('hidden'); return; }
      matchMsg.classList.remove('hidden');
      matchMsg.dataset.ok = ok ? '1' : '0';
      matchMsg.textContent = ok ? '✓ ' + tr('credMatch', 'Las contraseñas coinciden') : '✗ ' + tr('credNoMatch', 'Las contraseñas no coinciden');
      matchMsg.style.color = ok ? OK_COLOR : FAIL_COLOR;
    }

    function toggleTheme() {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('modoOscuro', dark);
      syncThemeIcon();
    }
    function syncThemeIcon() {
      const dark = document.documentElement.classList.contains('dark');
      document.getElementById('th-moon').classList.toggle('hidden', dark);
      document.getElementById('th-sun').classList.toggle('hidden', !dark);
      const label = document.getElementById('th-label');
      const key = dark ? 'themeLight' : 'changeTheme';
      label.setAttribute('data-i18n', key);
      label.textContent = tr(key, dark ? 'Modo claro' : 'Modo oscuro');
    }
    syncThemeIcon();

    // ── Selector de idioma ──
    function postJSON(url, body) {
      const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf }, body: JSON.stringify(body) });
    }
    function syncLangUI(lang) {
      const info = window.SUPPORTED_LANGS?.[lang];
      if (!info) return;
      document.getElementById('langFlag').className  = `fi fi-${info.country} rounded-sm flex-shrink-0`;
      document.getElementById('langLabel').textContent = info.label;
    }
    window.setLang = async lang => {
      await setLanguage(lang);
      syncLangUI(lang);
      document.getElementById('langMenu').classList.add('hidden');
      refreshDynamicTexts();
      // Guarda el idioma en el servidor (mismo endpoint que el dashboard). Si falla, no bloquea.
      try { await postJSON('/api/idioma', { idioma: lang }); } catch {}
    };
    // Reaplica textos que genera el JS (no usan data-i18n)
    function refreshDynamicTexts() {
      syncThemeIcon();
      if (!matchMsg.classList.contains('hidden')) checkMatch();
    }
    document.getElementById('langBtn').addEventListener('click', () =>
      document.getElementById('langMenu').classList.toggle('hidden'));
    document.addEventListener('click', e => {
      if (!e.target.closest('#langBtn') && !e.target.closest('#langMenu'))
        document.getElementById('langMenu').classList.add('hidden');
    });
    document.addEventListener('langchange', refreshDynamicTexts);
    syncLangUI(localStorage.getItem('lang') || 'es');
  </script>
</body>
</html>
